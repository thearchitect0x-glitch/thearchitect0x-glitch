<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="A terminal: whoami, the five builds, the badges, and a refusal to sleep.">
<rect width="1000" height="400" rx="16" fill="#0b0a12" stroke="#fff" stroke-opacity=".12"/>
<rect width="1000" height="40" rx="16" fill="#16141f"/><rect y="24" width="1000" height="16" fill="#16141f"/>
<circle cx="26" cy="20" r="7" fill="#ff5f57"/><circle cx="50" cy="20" r="7" fill="#febc2e"/><circle cx="74" cy="20" r="7" fill="#28c840"/>
<text x="500.0" y="25" text-anchor="middle" fill="#fff" fill-opacity=".5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">architect@deimos: ~</text>
<clipPath id="c0"><rect x="28" y="60" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="0.40s" dur="0.40s" fill="freeze"/></rect></clipPath><text x="34" y="82" fill="#39ff88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c0)" xml:space="preserve">$ whoami</text><clipPath id="c1"><rect x="28" y="90" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="1.05s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34" y="112" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c1)" xml:space="preserve">the architect · co-founder, Deimos AI LLC</text><clipPath id="c2"><rect x="28" y="120" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="1.80s" dur="0.95s" fill="freeze"/></rect></clipPath><text x="34" y="142" fill="#39ff88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c2)" xml:space="preserve">$ deimos ls --built</text><clipPath id="c3"><rect x="28" y="150" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="3.00s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34" y="172" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c3)" xml:space="preserve">clockford  (patent pending)   ratchet   crimp  (patent pending)   marklode   m.a.x</text><clipPath id="c4"><rect x="28" y="180" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="3.75s" dur="0.75s" fill="freeze"/></rect></clipPath><text x="34" y="202" fill="#39ff88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c4)" xml:space="preserve">$ deimos badges</text><clipPath id="c5"><rect x="28" y="210" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="4.75s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34" y="232" fill="#fff23a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c5)" xml:space="preserve">OpenSSF Best Practices: SILVER × 2   ·   clockford private beta: 10 NOV</text><clipPath id="c6"><rect x="28" y="240" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="5.50s" dur="0.50s" fill="freeze"/></rect></clipPath><text x="34" y="262" fill="#39ff88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c6)" xml:space="preserve">$ sleep 8h</text><clipPath id="c7"><rect x="28" y="270" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="6.25s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34" y="292" fill="#ff2bd6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c7)" xml:space="preserve">sleep: refused. the agents never sleep either.</text><clipPath id="c8"><rect x="28" y="300" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="7.00s" dur="0.70s" fill="freeze"/></rect></clipPath><text x="34" y="322" fill="#39ff88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c8)" xml:space="preserve">$ wolf --where</text><clipPath id="c9"><rect x="28" y="330" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="7.95s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34" y="352" fill="#00e5ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" clip-path="url(#c9)" xml:space="preserve">🐺 somewhere on this page. he moves every day.</text>
<rect x="34" y="365" width="10" height="20" fill="#39ff88" opacity="0"><animate attributeName="opacity" values="1;0" dur=".9s" begin="8.7s" calcMode="discrete" repeatCount="indefinite"/></rect>
</svg>