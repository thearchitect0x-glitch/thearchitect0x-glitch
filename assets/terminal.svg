<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="A terminal: whoami, the five builds, the three OpenSSF Silver badges, and a refusal to sleep."><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter><filter id="hue"><feColorMatrix type="hueRotate" values="0"><animate attributeName="values" values="0;360" dur="16s" repeatCount="indefinite"/></feColorMatrix></filter></defs><rect width="1000" height="400" rx="16" fill="#0b0a12" stroke="#fff" stroke-opacity=".12"/><rect width="1000" height="40" rx="16" fill="#16141f"/><rect y="24" width="1000" height="16" fill="#16141f"/><circle cx="26" cy="20" r="7" fill="#ff5f57"/><circle cx="50" cy="20" r="7" fill="#febc2e"/><circle cx="74" cy="20" r="7" fill="#28c840"/><text x="500.0" y="25.0" fill="#fff" fill-opacity="0.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0" >architect@deimos: ~</text><clipPath id="c0"><rect x="28" y="60" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="0.40s" dur="0.40s" fill="freeze"/></rect></clipPath><text x="34.0" y="82.0" fill="#39ff88" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c0)" xml:space="preserve">$ whoami</text><clipPath id="c1"><rect x="28" y="90" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="1.05s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34.0" y="112.0" fill="#fff" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c1)" xml:space="preserve">the architect · co-founder, Deimos AI LLC</text><clipPath id="c2"><rect x="28" y="120" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="1.80s" dur="0.95s" fill="freeze"/></rect></clipPath><text x="34.0" y="142.0" fill="#39ff88" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c2)" xml:space="preserve">$ deimos ls --built</text><clipPath id="c3"><rect x="28" y="150" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="3.00s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34.0" y="172.0" fill="#fff" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c3)" xml:space="preserve">clockford   ratchet   crimp   marklode   wardlatch</text><clipPath id="c4"><rect x="28" y="180" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="3.75s" dur="0.75s" fill="freeze"/></rect></clipPath><text x="34.0" y="202.0" fill="#39ff88" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c4)" xml:space="preserve">$ deimos badges</text><clipPath id="c5"><rect x="28" y="210" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="4.75s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34.0" y="232.0" fill="#fff23a" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c5)" xml:space="preserve">OpenSSF Best Practices: SILVER × 3 (self-certified)   ·   ratchet · crimp · wardlatch</text><clipPath id="c6"><rect x="28" y="240" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="5.50s" dur="0.50s" fill="freeze"/></rect></clipPath><text x="34.0" y="262.0" fill="#39ff88" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c6)" xml:space="preserve">$ sleep 8h</text><clipPath id="c7"><rect x="28" y="270" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="6.25s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34.0" y="292.0" fill="#ff2bd6" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c7)" xml:space="preserve">sleep: refused. the agents never sleep either.</text><clipPath id="c8"><rect x="28" y="300" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="7.00s" dur="0.70s" fill="freeze"/></rect></clipPath><text x="34.0" y="322.0" fill="#39ff88" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c8)" xml:space="preserve">$ wolf --where</text><clipPath id="c9"><rect x="28" y="330" height="30" width="0"><animate attributeName="width" from="0" to="1000" begin="7.95s" dur="0.05s" fill="freeze"/></rect></clipPath><text x="34.0" y="352.0" fill="#00e5ff" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0" clip-path="url(#c9)" xml:space="preserve">somewhere on this page. find him. read the word on his cheese.</text><rect x="34" y="365" width="10" height="20" fill="#39ff88" opacity="0"><animate attributeName="opacity" values="1;0" dur=".9s" begin="8.7s" calcMode="discrete" repeatCount="indefinite"/></rect></svg>